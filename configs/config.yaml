# Watchdog Agent Configuration
# Copy to configs/config.local.yaml for local overrides (gitignored)

agent:
  name: "watchdog-agent-01"
  port: 8081
  log_level: "info"              # debug, info, warn, error
  reconcile_interval: "60s"      # how often to run the collection loop

prometheus:
  url: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090"
  timeout: "5s"
  history_window: "24h"          # usage history sent to the forecaster
  history_step: "15m"            # resolution of that history

opencost:
  url: "http://opencost.opencost.svc.cluster.local:9003"
  timeout: "5s"
  window: "1d"                   # allocation window; costs are projected to a monthly run-rate

kubernetes:
  namespace: ""                  # empty = all namespaces
  excluded_namespaces:
    - kube-system
    - kube-public
    - kube-node-lease

logging:
  format: "text"                 # json or text
  level: "info"

storage:
  path: "./data.db"              # path to the SQLite database file

ai_service:
  url: "http://localhost:8000"

policy:
  min_replicas: 2
  max_step_down_percent: 0.30    # largest CPU request reduction allowed in one change
  min_confidence: 0.60
  min_cpu_request: 0.05          # cores
  excluded_namespaces:
    - kube-system
    - monitoring
    - watchdog

api:
  allowed_origins:
    - "http://localhost:3000"

gitops:
  enabled: false                 # open PRs on the infra repo for approved recommendations
  repo: "mithulpranav24/watchdog-infra"
  base_branch: "main"
  manifest_root: "workloads"     # manifests live at <manifest_root>/<namespace>/<name>/
  branch_prefix: "watchdog/"     # one branch and PR per workload: <prefix><namespace>-<name>
  api_url: "https://api.github.com"
  timeout: "30s"                 # per GitHub API request
  operation_timeout: "2m"        # all work for one workload, including git clone and push
  author_name: "Watchdog Agent"
  author_email: "watchdog-agent@users.noreply.github.com"
  cooldown: "24h"                # after a merged PR, wait this long before proposing another change to that workload
  auth: "token"                  # token: GITHUB_TOKEN env var; app: GitHub App installation (settings below)
  app_id: 0
  installation_id: 0
  private_key_path: "/etc/watchdog/github-app/private-key.pem"
