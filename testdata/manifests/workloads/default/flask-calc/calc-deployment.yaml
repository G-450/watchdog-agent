apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-calc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calc
  template:
    metadata:
      labels:
        app: calc
    spec:
      containers:
      - name: flask-app
        image: mithulpranav24/calculator:latest
        ports:
        - containerPort: 4591
---
apiVersion: v1
kind: Service
metadata:
  name: calc-service
spec:
  type: NodePort
  selector:
    app: calc
  ports:
    - port: 80
      targetPort: 4591
      nodePort: 30001
