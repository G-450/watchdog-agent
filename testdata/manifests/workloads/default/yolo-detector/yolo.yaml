apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolo-detector
spec:
  selector:
    matchLabels:
      app: yolo
  template:
    metadata:
      labels:
        app: yolo
    spec:
      containers:
      - name: yolo
        image: mithulpranav24/yolo-v8n:latest
        resources:
          requests:
            memory: "300Mi"
            cpu: "500m"      # The HPA will base its 70% target off this value
          limits:
            memory: "1500Mi"
            cpu: "1"
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: yolo-service
spec:
  type: NodePort
  selector:
    app: yolo
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30004
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: yolo-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: yolo-detector
  minReplicas: 1           # Scales down to 1 when idle
  maxReplicas: 8           # Scales up to 8 during bombardment
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
